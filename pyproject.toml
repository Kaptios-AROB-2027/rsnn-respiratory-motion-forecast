[project]
name = "rsnn-resp"
version = "1.0.0"
description = "Online-trained recurrent spiking neural networks (e-prop) for real-time respiratory motion forecasting"
readme = "README.md"
authors = [
    { name = "bniepce", email = "brad.niepce@kaptios.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jax[cuda13]>=0.12.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.uv]
package = false  # scripts/ put src/ on the import path

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E731", "E741", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["dataset", "evaluation", "models", "training", "paths"]
